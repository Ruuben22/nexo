<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12141a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nexo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Nexo — Nutrición y Rendimiento</title>
<style>
/* ============================================================
   NEXO — Personal Nutrition & Performance Coach
   Diseño: graphite + lima cítrica + albaricoque + teal
   ============================================================ */

:root{
  --bg:#12141a;
  --bg-elevated:#171a21;
  --surface:#1b1e26;
  --surface-2:#232733;
  --surface-hover:#282d3a;
  --border:#2a2e3a;
  --border-soft:#22252f;
  --text:#edeff3;
  --text-dim:#9aa0ae;
  --text-faint:#5f6472;

  --lime:#b7d64a;
  --lime-dim:#8fa93a;
  --lime-glow:rgba(183,214,74,0.16);

  --apricot:#f0955c;
  --apricot-dim:#c97847;
  --apricot-glow:rgba(240,149,92,0.16);

  --teal:#57bfb0;
  --teal-dim:#3f9488;
  --teal-glow:rgba(87,191,176,0.16);

  --red:#e2637a;
  --red-glow:rgba(226,99,122,0.14);

  --violet:#9d8cf0;
  --violet-glow:rgba(157,140,240,0.14);

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --radius-pill:999px;

  --shadow-card:0 1px 0 rgba(255,255,255,0.02) inset, 0 8px 24px rgba(0,0,0,0.28);
  --shadow-pop:0 20px 60px rgba(0,0,0,0.5);

  --ease:cubic-bezier(.22,.9,.32,1);
  --dur-fast:140ms;
  --dur:260ms;
  --dur-slow:420ms;

  --font-display:Georgia,'Iowan Old Style','Palatino Linotype',Palatino,serif;
  --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono','Cascadia Code','Roboto Mono',Consolas,monospace;

  --sidebar-w:236px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html{-webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;}
body{
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(183,214,74,0.05), transparent 60%),
    radial-gradient(900px 500px at 0% 100%, rgba(87,191,176,0.04), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
}
body.no-anim *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}

::selection{background:var(--lime); color:#12141a;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--surface-2); border-radius:99px; border:2px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--surface-hover);}

button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text); background:transparent;}
a{color:inherit; text-decoration:none;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-faint);
  font-weight:500;
}
.hnum{font-family:var(--font-display); font-weight:400; letter-spacing:-.01em;}

/* ---------- App shell ---------- */
#app{display:flex; min-height:100vh;}

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:var(--bg-elevated);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  padding:22px 14px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
  z-index:40;
}
.sidebar-brand{
  display:flex; align-items:center; gap:10px;
  padding:6px 10px 22px 10px;
}
.sidebar-brand .mark{
  width:30px; height:30px; border-radius:9px;
  background:linear-gradient(135deg, var(--lime), var(--teal));
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.sidebar-brand .mark svg{width:16px; height:16px;}
.sidebar-brand .name{font-family:var(--font-display); font-size:19px; letter-spacing:-.01em;}
.sidebar-brand .sub{font-size:10px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:.08em; text-transform:uppercase;}

.nav-group{margin-bottom:18px;}
.nav-group-label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-faint); padding:0 12px; margin-bottom:6px; display:block;
}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:11px;
  color:var(--text-dim); font-size:13.5px; font-weight:500;
  border:none; background:transparent; width:100%; text-align:left;
  transition:background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
  position:relative;
}
.nav-item svg{width:17px; height:17px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:var(--surface); color:var(--text);}
.nav-item.active{background:var(--surface-2); color:var(--text);}
.nav-item.active::before{
  content:''; position:absolute; left:-14px; top:50%; transform:translateY(-50%);
  width:3px; height:16px; border-radius:3px; background:var(--lime);
}
.nav-item .badge{
  margin-left:auto; font-family:var(--font-mono); font-size:10px;
  background:var(--surface-2); color:var(--text-dim); padding:1px 6px; border-radius:99px;
}

.sidebar-foot{
  margin-top:auto; padding-top:14px; border-top:1px solid var(--border-soft);
}
.streak-pill{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  background:var(--surface); border-radius:12px; border:1px solid var(--border-soft);
}
.streak-pill svg{width:15px; height:15px; color:var(--apricot);}
.streak-pill .n{font-family:var(--font-display); font-size:16px;}
.streak-pill .l{font-size:10.5px; color:var(--text-faint);}

.main{flex:1; min-width:0;}
.topbar{
  position:sticky; top:0; z-index:30;
  background:rgba(18,20,26,0.82); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border-soft);
  padding:16px 34px;
  display:flex; align-items:center; justify-content:space-between; gap:20px;
}
.topbar h1{font-family:var(--font-display); font-size:22px; font-weight:400; letter-spacing:-.01em;}
.topbar .date{font-size:12px; color:var(--text-faint); font-family:var(--font-mono); text-transform:capitalize;}
.topbar-actions{display:flex; gap:10px; align-items:center;}

.view{padding:28px 34px 80px 34px; max-width:1360px;}
.view-hidden{display:none;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:9px 16px; border-radius:11px; font-size:13.5px; font-weight:600;
  border:1px solid var(--border); background:var(--surface); color:var(--text);
  transition:transform var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease), border-color var(--dur-fast) var(--ease);
  white-space:nowrap;
}
.btn svg{width:14px; height:14px;}
.btn:hover{background:var(--surface-hover); border-color:var(--surface-hover);}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--lime); border-color:var(--lime); color:#131507;}
.btn-primary:hover{background:#c3e15c; border-color:#c3e15c;}
.btn-ghost{background:transparent; border-color:transparent;}
.btn-ghost:hover{background:var(--surface);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:9px;}
.btn-danger{color:var(--red);}
.btn-block{width:100%;}
.icon-btn{
  width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
}
.icon-btn:hover{color:var(--text); background:var(--surface-hover);}
.icon-btn svg{width:15px; height:15px;}

/* ---------- Cards / grid ---------- */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-12{grid-template-columns:repeat(12,1fr);}
.span-4{grid-column:span 4;}
.span-5{grid-column:span 5;}
.span-6{grid-column:span 6;}
.span-7{grid-column:span 7;}
.span-8{grid-column:span 8;}
.span-12{grid-column:span 12;}

.card{
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-lg);
  padding:20px;
  box-shadow:var(--shadow-card);
  animation:fadeUp var(--dur-slow) var(--ease) both;
}
.card-title{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;
}
.card-title h3{font-size:14px; font-weight:600;}
.card-title .eyebrow{margin-bottom:2px;}

.stat-card{display:flex; flex-direction:column; gap:10px;}
.stat-card .top{display:flex; align-items:center; justify-content:space-between;}
.stat-card .icon-wrap{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;}
.stat-card .icon-wrap svg{width:15px; height:15px;}
.stat-card .value{font-family:var(--font-display); font-size:30px; letter-spacing:-.01em; display:flex; align-items:baseline; gap:5px;}
.stat-card .value .unit{font-family:var(--font-body); font-size:13px; color:var(--text-faint); font-weight:500;}
.stat-card .delta{font-size:12px; font-weight:600; display:flex; align-items:center; gap:4px;}
.delta-pos{color:var(--lime);}
.delta-neg{color:var(--red);}
.delta-flat{color:var(--text-faint);}
.stat-card .sub{font-size:11.5px; color:var(--text-faint);}

@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
@keyframes popIn{from{opacity:0; transform:scale(.94);} to{opacity:1; transform:scale(1);}}
@keyframes ringGrow{from{stroke-dashoffset:var(--circ);} to{stroke-dashoffset:var(--offset);}}
@keyframes shimmer{0%{background-position:-200% 0;} 100%{background-position:200% 0;}}
@keyframes pulseSoft{0%,100%{opacity:1;} 50%{opacity:.55;}}

/* ---------- Rings (signature element) ---------- */
.ring-hero{position:relative; display:flex; align-items:center; justify-content:center;}
.ring-hero svg{transform:rotate(-90deg);}
.ring-track{fill:none; stroke:var(--surface-2); stroke-width:9;}
.ring-fill{fill:none; stroke-linecap:round; transition:stroke-dashoffset 1s var(--ease);}
.ring-center{position:absolute; text-align:center;}
.ring-center .n{font-family:var(--font-display); font-size:34px; line-height:1;}
.ring-center .l{font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono); letter-spacing:.08em; text-transform:uppercase; margin-top:4px;}

.macro-legend{display:flex; flex-direction:column; gap:10px;}
.macro-row{display:flex; align-items:center; gap:10px; font-size:12.5px;}
.macro-dot{width:8px; height:8px; border-radius:99px; flex-shrink:0;}
.macro-row .lbl{color:var(--text-dim); flex:1;}
.macro-row .val{font-family:var(--font-mono); font-weight:600;}
.macro-row .val .of{color:var(--text-faint); font-weight:400;}

/* mini progress bars */
.bar-track{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; transition:width .8s var(--ease);}

/* ---------- Tags / badges ---------- */
.tag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:600; padding:3px 8px; border-radius:99px;
  background:var(--surface-2); color:var(--text-dim); font-family:var(--font-mono); letter-spacing:.02em;
}
.tag-lime{background:var(--lime-glow); color:var(--lime);}
.tag-apricot{background:var(--apricot-glow); color:var(--apricot);}
.tag-teal{background:var(--teal-glow); color:var(--teal);}
.tag-red{background:var(--red-glow); color:var(--red);}
.tag-violet{background:var(--violet-glow); color:var(--violet);}

/* ---------- Meal cards ---------- */
.day-col{display:flex; flex-direction:column; gap:10px; min-width:0;}
.day-col-head{display:flex; align-items:center; justify-content:space-between; padding:0 2px 4px 2px;}
.day-col-head .dname{font-weight:700; font-size:13px;}
.day-col-head .ddate{font-size:10.5px; color:var(--text-faint); font-family:var(--font-mono);}
.day-col-head.today .dname{color:var(--lime);}

.meal-card{
  background:var(--bg-elevated); border:1px solid var(--border-soft); border-radius:14px;
  padding:12px; transition:border-color var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
  position:relative; overflow:hidden;
}
.meal-card:hover{border-color:var(--surface-2);}
.meal-card .slot-label{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; display:block;}
.meal-card .rname{font-size:12.5px; font-weight:600; line-height:1.3; margin-bottom:8px; min-height:32px;}
.meal-card .rmeta{display:flex; align-items:center; gap:8px; font-size:10.5px; color:var(--text-faint); margin-bottom:9px;}
.meal-card .rmeta span{display:flex; align-items:center; gap:3px;}
.meal-card .rmeta svg{width:10px; height:10px;}
.meal-card .ractions{display:flex; gap:6px;}
.meal-card .ractions button{flex:1; font-size:10.5px; padding:6px 8px;}
.meal-card.eaten{opacity:.55;}
.meal-card.eaten::after{
  content:'✓ Comido'; position:absolute; top:8px; right:8px; font-size:9px; font-family:var(--font-mono);
  color:var(--lime); background:var(--lime-glow); padding:2px 6px; border-radius:99px;
}

/* ---------- Recipe grid / cards ---------- */
.recipe-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-md);
  overflow:hidden; display:flex; flex-direction:column; transition:transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
  cursor:pointer;
}
.recipe-card:hover{transform:translateY(-3px); border-color:var(--surface-2);}
.recipe-card .thumb{aspect-ratio:16/10; background:var(--bg-elevated); display:flex; align-items:center; justify-content:center; position:relative;}
.recipe-card .thumb svg{width:44%; height:44%; opacity:.85;}
.recipe-card .thumb .fav{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:99px; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center;}
.recipe-card .thumb .fav svg{width:13px; height:13px;}
.recipe-card .body{padding:13px; display:flex; flex-direction:column; gap:8px; flex:1;}
.recipe-card .rtitle{font-size:13px; font-weight:700; line-height:1.3;}
.recipe-card .rtags{display:flex; flex-wrap:wrap; gap:4px;}
.recipe-card .rstats{display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-faint); margin-top:auto; padding-top:8px; border-top:1px solid var(--border-soft);}
.recipe-card .rstats b{color:var(--text-dim); font-family:var(--font-mono);}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,9,12,0.7); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:24px;
  animation:fadeIn var(--dur) var(--ease);
}
.modal{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
  max-width:640px; width:100%; max-height:85vh; overflow-y:auto;
  box-shadow:var(--shadow-pop); animation:popIn var(--dur) var(--ease);
}
.modal-lg{max-width:920px;}
.modal-head{
  display:flex; align-items:center; justify-content:space-between; padding:18px 22px;
  border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--surface); z-index:2;
}
.modal-head h2{font-family:var(--font-display); font-size:19px; font-weight:400;}
.modal-body{padding:22px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--border-soft); display:flex; justify-content:flex-end; gap:10px;}

/* ---------- Forms ---------- */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:14px;}
.field label{font-size:11.5px; font-weight:600; color:var(--text-dim);}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; padding:9px 11px; font-size:13.5px;
  transition:border-color var(--dur-fast) var(--ease);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--lime);}
.field .hint{font-size:10.5px; color:var(--text-faint);}
.field-row{display:flex; gap:12px;}
.field-row .field{flex:1;}
.seg{display:flex; background:var(--bg-elevated); border:1px solid var(--border); border-radius:10px; padding:3px; gap:3px;}
.seg button{flex:1; padding:7px 10px; border-radius:8px; border:none; background:transparent; color:var(--text-dim); font-size:12.5px; font-weight:600;}
.seg button.active{background:var(--surface-2); color:var(--text);}
.chip-select{display:flex; flex-wrap:wrap; gap:7px;}
.chip{padding:7px 12px; border-radius:99px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-dim); font-size:12px; font-weight:600;}
.chip.active{background:var(--lime-glow); border-color:var(--lime); color:var(--lime);}

/* Goal cards */
.goal-card{
  border:1px solid var(--border); background:var(--bg-elevated); border-radius:var(--radius-md); padding:16px;
  cursor:pointer; transition:all var(--dur) var(--ease); display:flex; flex-direction:column; gap:8px;
}
.goal-card:hover{border-color:var(--surface-2);}
.goal-card.active{border-color:var(--lime); background:var(--lime-glow);}
.goal-card .gicon{width:32px; height:32px; border-radius:9px; background:var(--surface-2); display:flex; align-items:center; justify-content:center;}
.goal-card .gicon svg{width:16px; height:16px;}
.goal-card h4{font-size:13.5px;}
.goal-card p{font-size:11.5px; color:var(--text-faint); line-height:1.4;}

/* AI Coach */
.coach-msg{
  display:flex; gap:12px; padding:14px; border-radius:14px; background:var(--bg-elevated); border:1px solid var(--border-soft);
}
.coach-msg .avatar{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--lime),var(--teal)); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.coach-msg .avatar svg{width:15px; height:15px; color:#12141a;}
.coach-msg .txt{font-size:12.5px; line-height:1.55; color:var(--text-dim);}
.coach-msg .txt b{color:var(--text); font-weight:600;}
.quick-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px;}
.quick-chip{
  display:flex; align-items:center; gap:6px; padding:8px 13px; border-radius:11px;
  background:var(--surface-2); border:1px solid var(--border-soft); font-size:12px; font-weight:600; color:var(--text-dim);
}
.quick-chip:hover{color:var(--text); border-color:var(--surface-hover);}
.quick-chip svg{width:13px; height:13px;}

/* Fridge */
.fridge-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:8px;}
.fridge-item{
  display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 8px;
  border-radius:12px; border:1px solid var(--border-soft); background:var(--bg-elevated); text-align:center;
}
.fridge-item.on{border-color:var(--lime); background:var(--lime-glow);}
.fridge-item svg{width:20px; height:20px;}
.fridge-item span{font-size:11px; font-weight:600;}

/* Shopping list */
.shop-group{margin-bottom:18px;}
.shop-group h4{font-size:12px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:8px; display:flex; align-items:center; gap:8px;}
.shop-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
  border:1px solid var(--border-soft); background:var(--bg-elevated); margin-bottom:6px; font-size:12.5px;
}
.shop-item .cb{width:16px; height:16px; border-radius:5px; border:1.5px solid var(--border); flex-shrink:0; display:flex; align-items:center; justify-content:center;}
.shop-item.checked{opacity:.45;}
.shop-item.checked .cb{background:var(--lime); border-color:var(--lime);}
.shop-item.checked .cb svg{width:10px; height:10px; color:#12141a;}
.shop-item .nm{flex:1;}
.shop-item .qt{font-family:var(--font-mono); color:var(--text-faint); font-size:11px;}

/* Toast */
#toast-wrap{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--surface-2); border:1px solid var(--border); padding:12px 16px; border-radius:12px;
  font-size:12.5px; display:flex; align-items:center; gap:9px; box-shadow:var(--shadow-pop);
  animation:popIn var(--dur) var(--ease);
}
.toast svg{width:14px; height:14px; color:var(--lime); flex-shrink:0;}

/* Empty state */
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; padding:50px 20px; color:var(--text-faint);}
.empty-state svg{width:40px; height:40px; margin-bottom:14px; opacity:.5;}
.empty-state h4{color:var(--text-dim); font-size:14px; margin-bottom:6px;}
.empty-state p{font-size:12px; max-width:320px;}

/* Table (stats) */
.simple-table{width:100%; border-collapse:collapse; font-size:12.5px;}
.simple-table th{text-align:left; font-family:var(--font-mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:8px 10px; border-bottom:1px solid var(--border-soft);}
.simple-table td{padding:9px 10px; border-bottom:1px solid var(--border-soft);}

/* Toggle switch */
.switch{position:relative; width:38px; height:22px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); flex-shrink:0;}
.switch::after{content:''; position:absolute; width:16px; height:16px; border-radius:99px; background:var(--text-faint); top:2px; left:2px; transition:all var(--dur) var(--ease);}
.switch.on{background:var(--lime-glow); border-color:var(--lime);}
.switch.on::after{left:18px; background:var(--lime);}
.row-between{display:flex; align-items:center; justify-content:space-between;}

/* Filter bar */
.filter-bar{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}

/* Responsive */
@media (max-width:1180px){
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12;}
}
@media (max-width:860px){
  .sidebar{position:fixed; left:-260px; transition:left var(--dur) var(--ease); box-shadow:var(--shadow-pop);}
  .sidebar.open{left:0;}
  .view{padding:20px 16px 70px 16px;}
  .topbar{padding:14px 16px;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .day-planner{overflow-x:auto;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}
/* ---------- GIMNASIO ---------- */
.gweek{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.gday{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 2px;border-radius:14px;background:var(--bg-elevated);border:1px solid var(--border-soft);text-align:center}
.gday[data-g]{cursor:pointer}

.gdone{position:absolute;top:4px;right:4px;width:14px;height:14px;border-radius:99px;background:var(--lime);color:#12141a;display:flex;align-items:center;justify-content:center}.gdone svg{width:9px;height:9px}
.gex{padding:12px;border-radius:12px;background:var(--bg-elevated);border:1px solid var(--border-soft);margin-bottom:8px;font-size:12.5px}
.gex .t{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:4px}
.gex p{color:var(--text-faint);font-size:11.5px;line-height:1.5;margin-top:3px}
.gwo{position:fixed;inset:0;z-index:120;background:var(--bg);display:flex;flex-direction:column}
.gwo-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border-soft)}
.gwo-body{flex:1;overflow-y:auto;padding:16px;width:100%;max-width:640px;margin:0 auto}

.gset.done input{border-color:var(--lime-dim)}.gset.done .gcheck{background:var(--lime);color:#12141a;border-color:var(--lime)}
.grest{display:flex;align-items:center;gap:10px}.grest .tm{font-family:var(--font-display);font-size:30px;min-width:92px}
.grest .bar-track{flex:1}

/* ==================== UTILS ==================== */
const Utils = {
  uid(prefix='id'){ return prefix + '_' + Math.random().toString(36).slice(2,9); },
  round(n, d=0){ const f = Math.pow(10,d); return Math.round((n+Number.EPSILON)*f)/f; },
  clamp(n,min,max){ return Math.max(min, Math.min(max,n)); },
  _iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); },
  todayISO(){ return Utils._iso(new Date()); },
  addDays(dateStr, n){ const d = new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return Utils._iso(d); },
  isoWeekStart(dateStr){
    const d = new Date((dateStr||Utils.todayISO())+'T00:00:00');
    const day = (d.getDay()+6)%7; // 0=Mon

  escapeHtml(str){
    if(str===undefined || str===null) return '';
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  kgToLb(kg){ return kg*2.2046226218; },
  lbToKg(lb){ return lb/2.2046226218; },
  displayWeight(kg, units){
    if(units==='lb') return Utils.round(Utils.kgToLb(kg),1);
    return Utils.round(kg,1);
  },
  weightUnitInputToKg(val, units){
    if(units==='lb') return Utils.lbToKg(val);
    return val;
  },
  debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; },
  sample(arr){ return arr[Math.floor(Math.random()*arr.length)]; },
  shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; },

/* ==================== STORAGE ==================== */
const Storage = {
  save(state){
    try{
      localStorage.setItem(CONFIG.APP_KEY, JSON.stringify(state));
      return true;
    }catch(e){ console.error('Error guardando en LocalStorage', e); return false; }
  },
  load(){
    try{
      const raw = localStorage.getItem(CONFIG.APP_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ console.error('Error leyendo LocalStorage', e); return null; }
  },
  exportJSON(state){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'nexo_backup_' + Utils.todayISO() + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  },
  reset(){ localStorage.removeItem(CONFIG.APP_KEY); }
};

/* ==================== STATE ==================== */
const State = {
  data: null,
  init(){
    const loaded = Storage.load();
    this.data = loaded ? this._migrate(loaded) : defaultState();
    this.save();
  },
  _migrate(d){
    const def = defaultState();
    // shallow-merge missing top-level keys to survive future upgrades
    Object.keys(def).forEach(k=>{ if(d[k]===undefined) d[k]=def[k]; });
    return d;
  },
  save: Utils.debounce(function(){ Storage.save(State.data); }, 250),
  saveNow(){ Storage.save(this.data); }
};

/* ==================== SERVICES ==================== */
const Calc = {
  /* Mifflin-St Jeor */
  bmr(profile){
    const {sex, weightKg, heightCm, age} = profile;
    const base = 10*weightKg + 6.25*heightCm - 5*age;
    return sex === 'hombre' ? base + 5 : base - 161;
  },
  tdee(profile){
    const factor = CONFIG.ACTIVITY_FACTORS[profile.activity] || 1.4;
    return this.bmr(profile) * factor;
  },
  bmi(profile){
    const h = profile.heightCm/100;
    return profile.weightKg / (h*h);
  },
  bmiLabel(bmi){
    if(bmi < 18.5) return 'Bajo peso';
    if(bmi < 25) return 'Normal';
    if(bmi < 30) return 'Sobrepeso';
    return 'Obesidad';
  },
  /* Calorías y macros objetivo según meta activa */
  targets(state){
    const p = state.profile;
    const goal = CONFIG.GOALS[p.goal] || CONFIG.GOALS.mantener;
    const tdee = this.tdee(p);
    let kcal = tdee * (1 + goal.kcalAdj);
    // límites de seguridad
    const floor = this.bmr(p) * 1.05;
    kcal = Math.max(kcal, floor);
    const proteinG = goal.protein * p.weightKg;
    const fatG = goal.fat * p.weightKg;
    const proteinKcal = proteinG * 4;
    const fatKcal = fatG * 9;
    let carbsKcal = kcal - proteinKcal - fatKcal;
    if(carbsKcal < 0) carbsKcal = kcal * 0.25;
    const carbsG = carbsKcal / 4;
    return {
      tdee: Utils.round(tdee),
      kcal: Utils.round(kcal),
      proteinG: Utils.round(proteinG),
      carbsG: Utils.round(carbsG),
      fatG: Utils.round(fatG),
      deficit: Utils.round(tdee - kcal),
      goal
    };
  },
  /* Proyección de peso lineal simplificada: 7700 kcal ~ 1kg de grasa */
  forecast(state, weeks=16){
    const p = state.profile;
    const t = this.targets(state);
    const weeklyDeltaKg = (t.deficit * 7) / 7700; // positivo = pierde peso si deficit>0
    const scenarios = {
      conservador: weeklyDeltaKg * 0.6,
      normal: weeklyDeltaKg,
      optimo: weeklyDeltaKg * 1.3
    };
    const series = {conservador:[], normal:[], optimo:[]};
    Object.keys(scenarios).forEach(key=>{
      let w = p.weightKg;
      for(let i=0;i<=weeks;i++){
        series[key].push(Utils.round(w,1));
        w -= scenarios[key];
      }
    });
    // fecha estimada para alcanzar objetivo (usando escenario normal)
    let weeksToGoal = null;
    if(Math.abs(weeklyDeltaKg) > 0.01){
      const diff = p.weightKg - p.targetWeightKg; // positivo si hay que perder
      const sameDirection = (diff>0 && weeklyDeltaKg>0) || (diff<0 && weeklyDeltaKg<0);
      if(sameDirection){
        weeksToGoal = Math.ceil(Math.abs(diff / weeklyDeltaKg));
      }
    }
    return { series, weeklyDeltaKg, weeksToGoal, scenarios };
  },
  /* simulación what-if: recibe overrides parciales del perfil/targets */
  simulate(state, overrides){
    const cloned = JSON.parse(JSON.stringify(state));
    Object.assign(cloned.profile, overrides.profile||{});
    if(overrides.goal) cloned.profile.goal = overrides.goal;
    const targets = this.targets(cloned);
    const fc = this.forecast(cloned, 16);
    return {targets, forecast:fc};
  }
};

const RecipeService = {
  byId(id){ return RECIPES.find(r=>r.id===id); },
  matchesSlot(recipe, slotId){
    if(slotId==='desayuno') return recipe.type.includes('desayuno');
    if(slotId==='snack1' || slotId==='snack2') return recipe.type.includes('snack') || recipe.type.includes('desayuno');
    if(slotId==='comida') return recipe.type.includes('comida');
    if(slotId==='cena') return recipe.type.includes('cena');
    return false;
  },
  matchesDiet(recipe, prefs){
    if(prefs.diet.includes('vegetariano') && !recipe.diet.includes('vegetariano')) return false;
    if(prefs.diet.includes('sin_gluten') && !recipe.diet.includes('sin_gluten')) return false;
    if(prefs.diet.includes('sin_lactosa') && !recipe.diet.includes('sin_lactosa')) return false;
    return true;
  },
  matchesAllergiesAndDislikes(recipe, prefs){
    const names = recipe.ingredients.map(i=>i.n.toLowerCase());
    const blocked = [...prefs.allergies, ...prefs.neverEat].map(x=>x.toLowerCase());
    for(const b of blocked){
      if(!b) continue;
      if(names.some(n=>n.includes(b)) || recipe.name.toLowerCase().includes(b)) return false;
    }
    if(state_bannedCheck(recipe)) return false;
    return true;
  },
  score(recipe, state, slotId){
    const prefs = state.preferences;
    const fb = state.recipeFeedback[recipe.id] || {favorite:false, timesSwapped:0, timesUsed:0};
    let s = 10;
    if(fb.favorite) s += 8;
    s -= fb.timesSwapped * 3; // si lo cambian mucho, baja
    s += Math.min(fb.timesUsed, 4) * 0.5; // familiaridad leve
    if(prefs.favoriteIngredients.some(fi => recipe.ingredients.some(ing=>ing.n.toLowerCase().includes(fi.toLowerCase())))) s += 3;
    if(recipe.cook + recipe.prep <= prefs.maxCookMinutes) s += 2;
    if(recipe.goal.includes(state.profile.goal)) s += 4;
    s += Math.random()*2; // variedad
    return s;
  },
  candidatesForSlot(state, slotId, filters={}){
    const prefs = state.preferences;
    let list = RECIPES.filter(r => this.matchesSlot(r, slotId));
    list = list.filter(r => this.matchesDiet(r, prefs));
    list = list.filter(r => this.matchesAllergiesAndDislikes(r, prefs));
    if(filters.diet) list = list.filter(r=>r.diet.includes(filters.diet));
    if(filters.maxTime) list = list.filter(r => (r.prep+r.cook) <= filters.maxTime);
    if(filters.sort === 'protein') list = list.slice().sort((a,b)=>b.protein-a.protein);
    else if(filters.sort === 'cheap') list = list.slice().sort((a,b)=>a.cost-b.cost);
    else if(filters.sort === 'fast') list = list.slice().sort((a,b)=>(a.prep+a.cook)-(b.prep+b.cook));
    else if(filters.sort === 'filling') list = list.slice().sort((a,b)=>b.fiber-a.fiber);
    else if(filters.sort === 'carbs') list = list.slice().sort((a,b)=>b.carbs-a.carbs);
    else if(filters.sort === 'fat') list = list.slice().sort((a,b)=>b.fat-a.fat);
    else list = list.slice().sort((a,b)=> this.score(b,state,slotId) - this.score(a,state,slotId));
    return list;
  },
  bestForSlot(state, slotId){
    const list = this.candidatesForSlot(state, slotId);

const MenuService = {
  ensureWeek(state, weekStart){
    if(!state.menus[weekStart]){
      state.menus[weekStart] = {};
      for(let d=0; d<7; d++) state.menus[weekStart][d] = {};
    }
    return state.menus[weekStart];
  },
  generateWeek(state, weekStart){
    const week = this.ensureWeek(state, weekStart);
    const usedThisWeek = new Set();
    for(let d=0; d<7; d++){
      week[d] = week[d] || {};
      CONFIG.MEAL_SLOTS.forEach(slot=>{
        let candidates = RecipeService.candidatesForSlot(state, slot.id);
        candidates = candidates.filter(r=>!usedThisWeek.has(r.id) || Math.random()<0.15);
        const pick = candidates[0] || RecipeService.candidatesForSlot(state, slot.id)[0];
        if(pick){
          week[d][slot.id] = pick.id;
          usedThisWeek.add(pick.id);
        }
      });
    }
    State.save();
    return week;
  },
  getMeal(state, weekStart, dayIdx, slotId){
    const week = state.menus[weekStart];
    if(!week || !week[dayIdx]) return null;
    return week[dayIdx][slotId] || null;
  },
  setMeal(state, weekStart, dayIdx, slotId, recipeId){
    const week = this.ensureWeek(state, weekStart);
    week[dayIdx] = week[dayIdx] || {};
    week[dayIdx][slotId] = recipeId;
    State.save();
  },
  swapMeal(state, weekStart, dayIdx, slotId, newRecipeId){
    const oldId = this.getMeal(state, weekStart, dayIdx, slotId);
    if(oldId){
      const fb = state.recipeFeedback[oldId] || {favorite:false,timesSwapped:0,timesUsed:0};
      fb.timesSwapped++;
      state.recipeFeedback[oldId] = fb;
    }
    const nfb = state.recipeFeedback[newRecipeId] || {favorite:false,timesSwapped:0,timesUsed:0};
    nfb.timesUsed++;
    state.recipeFeedback[newRecipeId] = nfb;
    this.setMeal(state, weekStart, dayIdx, slotId, newRecipeId);
  },
  dayTotals(state, weekStart, dayIdx){
    const week = state.menus[weekStart];
    const totals = {kcal:0, protein:0, carbs:0, fat:0, fiber:0, cost:0};
    if(!week || !week[dayIdx]) return totals;
    CONFIG.MEAL_SLOTS.forEach(slot=>{
      const rid = week[dayIdx][slot.id];
      if(rid){
        const r = RecipeService.byId(rid);
        if(r){
          totals.kcal += r.kcal; totals.protein += r.protein; totals.carbs += r.carbs;
          totals.fat += r.fat; totals.fiber += r.fiber; totals.cost += r.cost;
        }
      }
    });
    return totals;
  },
  weekTotals(state, weekStart){
    const totals = {kcal:0, protein:0, carbs:0, fat:0, cost:0};
    for(let d=0; d<7; d++){
      const t = this.dayTotals(state, weekStart, d);
      totals.kcal += t.kcal; totals.protein += t.protein; totals.carbs += t.carbs; totals.fat += t.fat; totals.cost += t.cost;
    }
    return totals;
  }
};

const ShoppingService = {
  buildList(state, weekStart){
    const week = state.menus[weekStart];
    const map = {}; // key: name -> {qty (sum, best-effort), unit, category, items:[]}
    if(!week) return {};
    for(let d=0; d<7; d++){
      const day = week[d] || {};
      Object.values(day).forEach(rid=>{
        const r = RecipeService.byId(rid);
        if(!r) return;
        r.ingredients.forEach(ing=>{
          const cat = INGREDIENT_CATEGORY[ing.n] || 'Otros';
          const key = ing.n + '__' + ing.u;
          if(!map[key]) map[key] = {name:ing.n, unit:ing.u, qty:0, category:cat};
          map[key].qty += ing.q;
        });
      });
    }
    // agrupar por categoría
    const grouped = {};
    Object.values(map).forEach(item=>{
      grouped[item.category] = grouped[item.category] || [];
      grouped[item.category].push(item);
    });
    return grouped;
  },
  itemKey(name, unit){ return name+'__'+unit; },
  totalCost(state, weekStart){
    return Utils.round(MenuService.weekTotals(state, weekStart).cost, 2);
  }
};

const BatchCookingService = {
  suggestions(state, weekStart){
    const week = state.menus[weekStart];
    if(!week) return [];
    const ingredientCount = {};
    for(let d=0; d<7; d++){
      Object.values(week[d]||{}).forEach(rid=>{
        const r = RecipeService.byId(rid);
        if(!r) return;
        r.ingredients.forEach(ing=>{
          const key = ing.n;
          ingredientCount[key] = (ingredientCount[key]||0) + ing.q;
        });
      });
    }
    const tips = [];
    Object.entries(ingredientCount).forEach(([name, qty])=>{
      if(['Pechuga de pollo','Arroz basmati','Arroz integral','Arroz','Quinoa','Lentejas','Garbanzos cocidos','Carne picada de ternera'].includes(name) && qty >= 250){
        const unit = INGREDIENT_CATEGORY[name] ? '' : '';
        tips.push(`Cocina ${Utils.round(qty)} g de ${name.toLowerCase()} el domingo y resérvalo para varias comidas de la semana.`);
      }
    });
    // recetas repetidas
    const counts = {};
    for(let d=0; d<7; d++){
      Object.values(week[d]||{}).forEach(rid=>{ counts[rid] = (counts[rid]||0)+1; });
    }
    Object.entries(counts).forEach(([rid, n])=>{
      if(n >= 3){
        const r = RecipeService.byId(rid);
        if(r) tips.push(`"${r.name}" aparece ${n} veces esta semana — prepara ración extra y ahorra unos ${(n-1)*r.cook} min de cocina.`);
      }
    });
    return tips.slice(0,6);
  }
};

/* ==================== AI COACH (motor de reglas, sin IA externa) ==================== */
const Coach = {
  todayMessages(state){
    const msgs = [];
    const today = Utils.todayISO();
    const dIdx = Utils.weekdayIndex(today);
    const training = state.training[dIdx];
    const targets = Calc.targets(state);

    if(training && training.type !== 'Descanso'){
      msgs.push(`Hoy entrenas <b>${training.type}</b> (${training.duration} min, intensidad ${training.intensity}) — mantenemos el carbohidrato alto para tener energía disponible.`);
    } else {
      msgs.push('Hoy es día de descanso — reducimos ligeramente el carbohidrato y priorizamos proteína y verdura.');
    }

    // proteína de ayer
    const yesterday = Utils.addDays(today, -1);
    const yTotals = this.dayLoggedTotals(state, yesterday);
    if(yTotals && yTotals.protein < targets.proteinG * 0.8){
      msgs.push(`Ayer te quedaste corto de proteína (~${Utils.round(yTotals.protein)} g de ${targets.proteinG} g objetivo). Hoy compensamos con opciones más proteicas.`);
    }

    // adherencia últimos días
    const adherence = Stats.weeklyAdherence(state);
    if(adherence !== null && adherence < 60){
      msgs.push(`Tu adherencia esta semana ronda el ${adherence}%. Nada grave — elegimos comidas más sencillas para que sea fácil retomar el ritmo.`);
    } else if(adherence !== null && adherence >= 90){
      msgs.push(`Adherencia excelente esta semana (${adherence}%). Seguimos con el plan tal cual, está funcionando.`);
    }

    // racha de días intensos
    const intense = this.consecutiveIntenseDays(state, today);
    if(intense >= 3){
      msgs.push('Llevas varios días de entrenamiento intenso seguidos — priorizamos una comida más saciante y con más carbohidrato de recuperación.');
    }

    return msgs;
  },
  dayLoggedTotals(state, dateISO){
    const weekStart = Utils.isoWeekStart(dateISO);
    const dIdx = Utils.weekdayIndex(dateISO);
    return MenuService.dayTotals(state, weekStart, dIdx);
  },
  consecutiveIntenseDays(state, fromDateISO){
    let count = 0;
    for(let i=1;i<=5;i++){
      const d = Utils.addDays(fromDateISO, -i);
      const idx = Utils.weekdayIndex(d);
      const tr = state.training[idx];
      if(tr && tr.intensity === 'alta') count++; else break;
    }
    return count;
  },
  applyQuickAction(state, action){
    const today = Utils.todayISO();
    const weekStart = Utils.isoWeekStart(today);
    const dIdx = Utils.weekdayIndex(today);
    const week = MenuService.ensureWeek(state, weekStart);
    const day = week[dIdx] = week[dIdx] || {};

    const replaceSlot = (slotId, filters) => {
      const list = RecipeService.candidatesForSlot(state, slotId, filters);
      if(list[0]) MenuService.swapMeal(state, weekStart, dIdx, slotId, list[0].id);
    };

    const nextSlot = () => {
      const hour = new Date().getHours();
      if(hour < 11) return 'desayuno';
      if(hour < 13) return 'snack1';
      if(hour < 17) return 'comida';
      if(hour < 20) return 'snack2';
      return 'cena';
    };

    switch(action){
      case 'hambre':
        replaceSlot(nextSlot(), {sort:'filling'});
        Toast.show('Buscamos algo más saciante para tu próxima comida.', Icon.utensils);
        break;
      case 'no_hambre':
        replaceSlot(nextSlot(), {maxTime:10});
        Toast.show('Cambiamos a algo más ligero y rápido.', Icon.utensils);
        break;
      case 'cansado':
        replaceSlot(nextSlot(), {sort:'carbs'});
        Toast.show('Añadimos algo más de carbohidrato para recuperar energía.', Icon.bolt);
        break;
      case 'energia':
        Toast.show('¡Genial! Mantenemos el plan de hoy tal cual.', Icon.bolt);
        break;
      case 'fuera':
        (state.freeMealsLog = state.freeMealsLog||[]).push({date: today, label:'Comida fuera', kcal: Calc.targets(state).kcal * 0.34});
        Toast.show('Anotado. Ajustamos el resto del día para seguir cerca del objetivo.', Icon.check);
        State.save();
        break;
      case '10min':
        replaceSlot(nextSlot(), {maxTime:10});
        Toast.show('Buscando recetas de 10 minutos o menos.', Icon.clock);
        break;
      case 'rico':
        replaceSlot(nextSlot(), {});
        Toast.show('Elegimos algo con más chicha para hoy.', Icon.chef);
        break;
      case 'minimo':
        replaceSlot(nextSlot(), {maxTime:8});
        Toast.show('Cocina mínima activada para tu próxima comida.', Icon.clock);
        break;
    }
    State.save();
  }
};

/* ==================== STATS ==================== */
const Stats = {
  weeklyAdherence(state){
    const today = Utils.todayISO();
    const weekStart = Utils.isoWeekStart(today);
    const log = state.logs.meals || {};
    let planned = 0, eaten = 0;
    for(let d=0; d<=Utils.weekdayIndex(today); d++){
      const date = Utils.addDays(weekStart, d);
      const dayLog = log[date] || {};
      CONFIG.MEAL_SLOTS.forEach(slot=>{
        planned++;
        if(dayLog[slot.id] && dayLog[slot.id].status === 'eaten') eaten++;
      });
    }
    if(planned === 0) return null;
    return Utils.round((eaten/planned)*100);
  },
  currentStreak(state){
    let streak = 0;
    let d = Utils.addDays(Utils.todayISO(), -1);
    while(true){
      const dayLog = (state.logs.meals||{})[d];
      if(!dayLog) break;
      const slots = Object.values(dayLog);
      const eatenCount = slots.filter(s=>s.status==='eaten').length;
      if(eatenCount >= 3){ streak++; d = Utils.addDays(d,-1); } else break;
      if(streak > 365) break;
    }
    return streak;
  },
  weightSeries(state, limit=60){
    const entries = Object.entries(state.logs.weight||{}).sort((a,b)=> a[0]<b[0]?-1:1);
    return entries.slice(-limit);
  }
};

/* Genera anillo SVG (donut) — elemento firma de la app */
function RingSVG({size=160, stroke=9, segments, centerLabel, centerSub}){
  const r = (size - stroke)/2;
  const circ = 2*Math.PI*r;
  const cx = size/2, cy = size/2;
  let offsetAcc = 0;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const rings = segments.map((seg, i)=>{
    const frac = Utils.clamp(seg.value/seg.max, 0, 1);
    const segCirc = circ;
    const dash = segCirc * frac;
    const gap = segCirc - dash;
    const rad = r - i*(stroke+4);
    const c = 2*Math.PI*rad;
    const d2 = c*frac;
    const g2 = c - d2;
    return `<circle class="ring-track" cx="${cx}" cy="${cy}" r="${rad}" stroke-width="${stroke}"></circle>
    <circle class="ring-fill" cx="${cx}" cy="${cy}" r="${rad}" stroke="${seg.color}" stroke-width="${stroke}"
      stroke-dasharray="${c}" stroke-dashoffset="${c - d2}" style="--circ:${c}; --offset:${c-d2}; animation:ringGrow 1s cubic-bezier(.22,.9,.32,1) both;"></circle>`;
  }).join('');
  return `<div class="ring-hero" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${rings}</svg>
    <div class="ring-center"><div class="n">${centerLabel}</div><div class="l">${centerSub}</div></div>
  </div>`;
}

function StatCard({icon, label, value, unit, delta, deltaLabel, color, sub}){
  const deltaClass = delta > 0 ? 'delta-pos' : delta < 0 ? 'delta-neg' : 'delta-flat';
  const deltaArrow = delta > 0 ? '▲' : delta < 0 ? '▼' : '—';
  return `<div class="card stat-card">
    <div class="top">
      <span class="eyebrow">${label}</span>
      <div class="icon-wrap" style="background:${color}22; color:${color};">${icon}</div>
    </div>
    <div class="value">${value}${unit?`<span class="unit">${unit}</span>`:''}</div>
    ${delta!==undefined ? `<div class="delta ${deltaClass}">${deltaArrow} ${Math.abs(delta)} ${deltaLabel||''}</div>` : (sub?`<div class="sub">${sub}</div>`:'')}
  </div>`;
}

function quickChip(action, icon, label){

function ForecastChartSVG(fc, state){
  const w = 560, h = 220, pad = 30;
  const all = [...fc.series.conservador, ...fc.series.normal, ...fc.series.optimo];
  const min = Math.min(...all) - 1, max = Math.max(...all) + 1;
  const n = fc.series.normal.length;
  const x = i => pad + (i/(n-1)) * (w - pad*2);
  const y = v => h - pad - ((v-min)/(max-min)) * (h - pad*2);
  const line = (arr) => arr.map((v,i)=> `${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  const targetY = y(state.profile.targetWeightKg);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="overflow:visible;">
    <line x1="${pad}" y1="${targetY}" x2="${w-pad}" y2="${targetY}" stroke="var(--border)" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="${w-pad}" y="${targetY-6}" text-anchor="end" font-size="10" fill="var(--text-faint)" font-family="ui-monospace,monospace">Objetivo ${Utils.displayWeight(state.profile.targetWeightKg, state.settings.units)} ${state.settings.units}</text>
    <path d="${line(fc.series.conservador)}" fill="none" stroke="var(--surface-2)" stroke-width="2"/>
    <path d="${line(fc.series.optimo)}" fill="none" stroke="var(--teal)" stroke-width="1.6" stroke-dasharray="3 4" opacity=".7"/>
    <path d="${line(fc.series.normal)}" fill="none" stroke="var(--lime)" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="${x(0)}" cy="${y(fc.series.normal[0])}" r="4" fill="var(--lime)"/>
  </svg>
  <div style="display:flex; gap:14px; margin-top:6px;">
    <span class="tag" style="background:transparent; color:var(--text-faint);"><span class="macro-dot" style="background:var(--lime); display:inline-block; margin-right:4px;"></span>Normal</span>
    <span class="tag" style="background:transparent; color:var(--text-faint);"><span class="macro-dot" style="background:var(--teal); display:inline-block; margin-right:4px;"></span>Óptimo</span>
    <span class="tag" style="background:transparent; color:var(--text-faint);"><span class="macro-dot" style="background:var(--surface-2); display:inline-block; margin-right:4px;"></span>Conservador</span>
  </div>`;
}

function WeightLineSVG(series, state){
  const w = 480, h = 180, pad=28;
  const vals = series.map(s=>Utils.displayWeight(s[1], state.settings.units));
  const min = Math.min(...vals)-0.5, max = Math.max(...vals)+0.5;
  const n = vals.length;
  const x = i => pad + (i/(Math.max(n-1,1))) * (w-pad*2);
  const y = v => h-pad - ((v-min)/(max-min||1)) * (h-pad*2);
  const path = vals.map((v,i)=>`${i===0?'M':'L'} ${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <path d="${path}" fill="none" stroke="var(--lime)" stroke-width="2.4" stroke-linecap="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--lime)"/>`).join('')}
  </svg>`;
}
function WeekBarsSVG(points, targets){
  const w=480, h=180, pad=26, bw = (w-pad*2)/points.length;
  const max = Math.max(targets.kcal*1.15, ...points.map(p=>p.kcal));
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}">
    <line x1="${pad}" y1="${h-pad-(targets.kcal/max)*(h-pad*2)}" x2="${w-pad}" y2="${h-pad-(targets.kcal/max)*(h-pad*2)}" stroke="var(--border)" stroke-dasharray="4 4"/>
    ${points.map((p,i)=>{
      const bh = (p.kcal/max)*(h-pad*2);
      const bx = pad + i*bw + bw*0.18;
      const bwidth = bw*0.64;
      const color = p.kcal > targets.kcal*1.05 ? 'var(--red)' : 'var(--lime)';
      return `<rect x="${bx}" y="${h-pad-bh}" width="${bwidth}" height="${bh}" rx="4" fill="${color}" opacity="${p.kcal?1:0.15}"/>
        <text x="${bx+bwidth/2}" y="${h-8}" text-anchor="middle" font-size="9" fill="var(--text-faint)" font-family="ui-monospace,monospace">${CONFIG.DAYS_SHORT[i]}</text>`;
    }).join('')}
  </svg>`;
}

const Router = {
  current: 'dashboard',
  recipeFilters: {q:'', type:'', diet:''},
  titles: {
    dashboard:'Panel', profile:'Perfil', goals:'Objetivo', training:'Entrenamiento',
    planner:'Comidas', recipes:'Recetas', fridge:'Nevera', shopping:'Lista de la compra',
    stats:'Estadísticas', whatif:'Simulador', settings:'Configuración'
  },
  go(view){
    this.current = view;
    document.querySelectorAll('.nav-item').forEach(el=>{
      el.classList.toggle('active', el.dataset.view === view);
    });
    document.querySelectorAll('.view').forEach(el=> el.classList.add('view-hidden'));
    const target = document.getElementById('view-'+view);
    target.classList.remove('view-hidden');
    document.getElementById('topbar-title').textContent = this.titles[view] || '';
    this.renderTopbarActions(view);
    this.render();
    document.getElementById('sidebar').classList.remove('open');
    window.scrollTo({top:0, behavior: State.data.settings.animations ? 'smooth' : 'auto'});
  },
  renderTopbarActions(view){
    const wrap = document.getElementById('topbar-actions');
    if(view === 'dashboard'){
      wrap.innerHTML = `<button class="btn btn-primary" id="topbar-log-weight">${Icon.plus} Registrar peso</button>`;
    } else if(view === 'shopping'){
      wrap.innerHTML = `<button class="btn" id="topbar-clear-checked">${Icon.trash} Limpiar marcados</button>`;
    } else {
      wrap.innerHTML = '';
    }
  },
  render(){
    const state = State.data;
    const el = document.getElementById('view-'+this.current);
    switch(this.current){
      case 'dashboard': el.innerHTML = Views.dashboard(state); break;
      case 'profile': el.innerHTML = Views.profile(state); break;
      case 'goals': el.innerHTML = Views.goals(state); break;
      case 'training': el.innerHTML = Views.training(state); break;
      case 'planner': el.innerHTML = Views.planner(state); break;
      case 'recipes': el.innerHTML = Views.recipes(state, this.recipeFilters); this._restoreSearchFocus(); break;
      case 'fridge': el.innerHTML = Views.fridge(state); break;
      case 'shopping': el.innerHTML = Views.shopping(state); break;
      case 'stats': el.innerHTML = Views.stats(state); break;
      case 'whatif': el.innerHTML = Views.whatif(state); break;
      case 'settings': el.innerHTML = Views.settings(state); break;
    }
    this.updateGlobals();
  },
  _restoreSearchFocus(){
    if(this._focusSearch){
      const inp = document.getElementById('recipe-search');
      if(inp){ inp.focus(); const p = this._focusSearch.pos; inp.setSelectionRange(p,p); }
    }
  },
  updateGlobals(){
    const state = State.data;
    document.getElementById('topbar-date').textContent = Utils.formatDateHuman(Utils.todayISO());
    document.getElementById('streak-n').textContent = Stats.currentStreak(state);
    const weekStart = state.currentWeekStart || Utils.isoWeekStart(Utils.todayISO());
    const grouped = ShoppingService.buildList(state, weekStart);
    let count = 0;
    Object.values(grouped).forEach(items=> items.forEach(it=>{
      if(!state.shopping.checked[ShoppingService.itemKey(it.name, it.unit)]) count++;
    }));
    document.getElementById('shop-badge').textContent = count;
  }
};

function openSwapModal(weekStart, dayIdx, slotId){
  const state = State.data;
  const slot = CONFIG.MEAL_SLOTS.find(s=>s.id===slotId);
  const render = (filters={}) => {
    const candidates = RecipeService.candidatesForSlot(state, slotId, filters);
    return candidates.slice(0,12).map(r=>`
      <div class="recipe-card" data-pick-recipe="${r.id}" style="cursor:pointer;">
        <div class="thumb">${RecipeThumb(r.icon)}</div>
        <div class="body">
          <div class="rtitle">${Utils.escapeHtml(r.name)}</div>
          <div class="rtags">${r.diet.slice(0,2).map(d=>`<span class="tag tag-lime">${d.replace('_',' ')}</span>`).join('')}</div>
          <div class="rstats"><span><b>${r.kcal}</b> kcal</span><span><b>${r.protein}g</b> prot</span><span><b>${r.prep+r.cook}</b> min</span></div>
        </div>
      </div>`).join('') || `<div class="empty-state" style="grid-column:1/-1;">${Icon.chef}<h4>Sin coincidencias</h4><p>Prueba otro filtro.</p></div>`;
  };
  const filterDefs = [
    {key:'protein', label:'Más proteína'}, {key:'cheap', label:'Más barato'}, {key:'fast', label:'Más rápido'},
    {key:'filling', label:'Más saciante'}, {key:'carbs', label:'Más carbohidratos'}, {key:'fat', label:'Más grasas'}
  ];
  const dietDefs = [{key:'vegetariano', label:'Vegetariano'},{key:'sin_gluten', label:'Sin gluten'},{key:'sin_lactosa', label:'Sin lactosa'}];

  Modal.open(`
    <div class="modal-head"><h2>Sustituir ${slot.label.toLowerCase()}</h2><button class="icon-btn" id="modal-close">${Icon.x}</button></div>
    <div class="modal-body">
      <div class="filter-bar">
        ${filterDefs.map(f=>`<button class="chip" data-swap-sort="${f.key}">${f.label}</button>`).join('')}
        ${dietDefs.map(f=>`<button class="chip" data-swap-diet="${f.key}">${f.label}</button>`).join('')}
      </div>
      <div class="grid" id="swap-results" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));">${render()}</div>
    </div>
  `, {large:true});

  let activeSort = null, activeDiet = null;
  document.getElementById('modal-close').onclick = Modal.close;
  document.querySelectorAll('[data-swap-sort]').forEach(btn=>{
    btn.onclick = ()=>{
      activeSort = activeSort === btn.dataset.swapSort ? null : btn.dataset.swapSort;
      document.querySelectorAll('[data-swap-sort]').forEach(b=>b.classList.toggle('active', b.dataset.swapSort===activeSort));
      document.getElementById('swap-results').innerHTML = render({sort:activeSort, diet:activeDiet});
      wireSwapPicks();
    };
  });
  document.querySelectorAll('[data-swap-diet]').forEach(btn=>{
    btn.onclick = ()=>{
      activeDiet = activeDiet === btn.dataset.swapDiet ? null : btn.dataset.swapDiet;
      document.querySelectorAll('[data-swap-diet]').forEach(b=>b.classList.toggle('active', b.dataset.swapDiet===activeDiet));
      document.getElementById('swap-results').innerHTML = render({sort:activeSort, diet:activeDiet});
      wireSwapPicks();
    };
  });
  function wireSwapPicks(){
    document.querySelectorAll('[data-pick-recipe]').forEach(card=>{
      card.onclick = ()=>{
        MenuService.swapMeal(state, weekStart, dayIdx, slotId, card.dataset.pickRecipe);
        Modal.close();
        Router.render();
        Toast.show('Comida sustituida correctamente.', Icon.swap);
      };
    });
  }
  wireSwapPicks();
}

/* ==================== EVENT WIRING (delegación global) ==================== */
function wireGlobalEvents(){
  const state = State.data;

  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=> Router.go(el.dataset.view));
  });
  document.getElementById('menu-toggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
  });
  if(window.innerWidth <= 860) document.getElementById('menu-toggle').style.display='flex';
  window.addEventListener('resize', ()=>{
    document.getElementById('menu-toggle').style.display = window.innerWidth<=860 ? 'flex' : 'none';
  });

  document.addEventListener('click', (e)=>{
    // Topbar dynamic actions
    if(e.target.closest('#topbar-log-weight')) openLogWeightModal();
    if(e.target.closest('#topbar-clear-checked')){
      state.shopping.checked = {}; State.save(); Router.render(); Toast.show('Lista reiniciada.', Icon.check);
    }

    // Quick chips (AI Coach)
    const quick = e.target.closest('[data-quick]');
    if(quick){ Coach.applyQuickAction(state, quick.dataset.quick); Router.render(); }

    // Profile sex segmented
    const segField = e.target.closest('[data-field]');
    if(segField){
      state.profile[segField.dataset.field] = segField.dataset.value;
      State.save(); Router.render(); Toast.show('Perfil actualizado.', Icon.check);
    }

    // Save profile
    if(e.target.closest('#save-profile')){
      const units = state.settings.units;
      state.profile.name = document.getElementById('f-name').value || state.profile.name;
      state.profile.age = parseInt(document.getElementById('f-age').value) || state.profile.age;
      state.profile.heightCm = parseFloat(document.getElementById('f-height').value) || state.profile.heightCm;
      state.profile.weightKg = Utils.weightUnitInputToKg(parseFloat(document.getElementById('f-weight').value), units) || state.profile.weightKg;
      state.profile.targetWeightKg = Utils.weightUnitInputToKg(parseFloat(document.getElementById('f-target').value), units) || state.profile.targetWeightKg;
      state.profile.activity = document.getElementById('f-activity').value;
      state.profile.job = document.getElementById('f-job').value;
      state.profile.steps = parseInt(document.getElementById('f-steps').value) || 0;
      state.profile.sleepHours = parseFloat(document.getElementById('f-sleep').value) || 0;
      state.logs.weight[Utils.todayISO()] = state.profile.weightKg;
      State.save();
      Router.render();
      Toast.show('Perfil guardado y recalculado.', Icon.check);
    }

    // Goal selection
    const goalCard = e.target.closest('[data-goal]');
    if(goalCard){
      state.profile.goal = goalCard.dataset.goal;
      State.save(); Router.render();
      Toast.show('Objetivo actualizado — calorías y macros recalculados.', Icon.target);
    }

    // Planner: week nav
    if(e.target.closest('#week-prev')){ state.currentWeekStart = Utils.addDays(state.currentWeekStart, -7); State.save(); Router.render(); }
    if(e.target.closest('#week-next')){ state.currentWeekStart = Utils.addDays(state.currentWeekStart, 7); State.save(); Router.render(); }
    if(e.target.closest('#today-btn')){ state.currentWeekStart = Utils.isoWeekStart(Utils.todayISO()); State.save(); Router.render(); }
    if(e.target.closest('#generate-week')){
      MenuService.generateWeek(state, state.currentWeekStart);
      Router.render();
      Toast.show('Menú semanal generado según tu objetivo y entrenamientos.', Icon.sparkle);
    }

    // Meal card actions
    const swapBtn = e.target.closest('[data-action="swap"]');
    if(swapBtn){ openSwapModal(swapBtn.dataset.week, parseInt(swapBtn.dataset.day), swapBtn.dataset.slot); }
    const eatenBtn = e.target.closest('[data-action="toggle-eaten"]');
    if(eatenBtn){
      const date = eatenBtn.dataset.date;
      const slot = eatenBtn.dataset.slot;
      state.logs.meals[date] = state.logs.meals[date] || {};
      const cur = state.logs.meals[date][slot];
      state.logs.meals[date][slot] = { status: (cur && cur.status==='eaten') ? 'pending' : 'eaten' };
      State.save(); Router.render();
    }

    // Recipe grid: open detail
    const recipeCard = e.target.closest('.recipe-card[data-recipe-id]');
    if(recipeCard && !e.target.closest('[data-fav-id]')){ openRecipeDetailModal(recipeCard.dataset.recipeId); }
    const favBtn = e.target.closest('[data-fav-id]');
    if(favBtn){
      e.stopPropagation();
      const id = favBtn.dataset.favId;
      const cur = state.recipeFeedback[id] || {favorite:false, timesSwapped:0, timesUsed:0};
      cur.favorite = !cur.favorite;
      state.recipeFeedback[id] = cur;
      State.save(); Router.render();
    }

    // Recipe filters
    const rTypeChip = e.target.closest('[data-rfilter-type]');
    if(rTypeChip){ Router.recipeFilters.type = rTypeChip.dataset.rfilterType || ''; Router.render(); }
    const rDietChip = e.target.closest('[data-rfilter-diet]');
    if(rDietChip){
      Router.recipeFilters.diet = Router.recipeFilters.diet === rDietChip.dataset.rfilterDiet ? '' : rDietChip.dataset.rfilterDiet;
      Router.render();
    }

    // Fridge
    const fridgeItem = e.target.closest('[data-fridge-item]');
    if(fridgeItem){
      const key = fridgeItem.dataset.fridgeItem;
      state.fridge[key] = !state.fridge[key];
      State.save(); Router.render();
    }
    if(e.target.closest('#whatcancook-btn')) openWhatCanICookModal();

    // Shopping list check
    const shopItem = e.target.closest('[data-shop-key]');
    if(shopItem){
      const key = shopItem.dataset.shopKey;
      state.shopping.checked[key] = !state.shopping.checked[key];
      State.save(); Router.render();
    }

    // Stats: log weight
    if(e.target.closest('#log-weight-btn')) openLogWeightModal();

    // Settings actions
    const unitBtn = e.target.closest('[data-unit]');
    if(unitBtn){ state.settings.units = unitBtn.dataset.unit; State.save(); Router.render(); }
    if(e.target.closest('#toggle-anim')){
      state.settings.animations = !state.settings.animations;
      document.body.classList.toggle('no-anim', !state.settings.animations);
      State.save(); Router.render();
    }
    const dietToggle = e.target.closest('[data-diet-toggle]');
    if(dietToggle){
      const d = dietToggle.dataset.dietToggle;
      const idx = state.preferences.diet.indexOf(d);
      if(idx >= 0) state.preferences.diet.splice(idx,1); else state.preferences.diet.push(d);
      State.save(); Router.render();
    }
    if(e.target.closest('#save-prefs')){
      const parseList = (v)=> v.split(',').map(s=>s.trim()).filter(Boolean);
      state.preferences.neverEat = parseList(document.getElementById('pref-dislikes').value);
      state.preferences.allergies = parseList(document.getElementById('pref-allergies').value);
      state.preferences.favoriteIngredients = parseList(document.getElementById('pref-favs').value);
      state.preferences.maxCookMinutes = parseInt(document.getElementById('pref-time').value) || 30;
      state.preferences.weeklyBudget = parseFloat(document.getElementById('pref-budget').value) || 70;
      State.save(); Router.render();
      Toast.show('Preferencias guardadas. El próximo menú las tendrá en cuenta.', Icon.check);
    }
    if(e.target.closest('#export-btn')){ Storage.exportJSON(state); Toast.show('Copia de seguridad descargada.', Icon.download); }
    if(e.target.closest('#reset-btn')){
      if(confirm('¿Seguro que quieres borrar todos tus datos? Esta acción no se puede deshacer.')){
        Storage.reset();
        location.reload();
      }
    }

    // Modal generic swap-recipe picks handled inline in openSwapModal
  });

  // Change / input events (selects, ranges, text inputs)
  document.addEventListener('change', (e)=>{
    const trField = e.target.closest('[data-tr-field]');
    if(trField){
      const day = trField.dataset.day;
      const field = trField.dataset.trField;
      let val = trField.value;
      if(field === 'duration') val = parseInt(val) || 0;
      state.training[day] = state.training[day] || {};
      state.training[day][field] = val;
      State.save();
      if(field === 'type') Router.render();
    }
    if(e.target.id === 'import-file'){
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        try{
          const imported = JSON.parse(ev.target.result);
          State.data = State._migrate(imported);
          State.saveNow();
          location.reload();
        }catch(err){ Toast.show('No se pudo importar el archivo.', Icon.x); }
      };
      reader.readAsText(file);
    }
    if(e.target.id === 'sim-goal' || e.target.id === 'sim-target' || e.target.id === 'sim-steps') updateWhatIf();
  });

  document.addEventListener('input', (e)=>{
    if(e.target.id === 'recipe-search'){
      Router.recipeFilters.q = e.target.value;
      Router._focusSearch = {pos: e.target.selectionStart};
      Router.render();
    }
    if(e.target.id === 'sim-target' || e.target.id === 'sim-steps') updateWhatIf();
  });

  function updateWhatIf(){
    const units = state.settings.units;
    const targetInput = document.getElementById('sim-target');
    const stepsInput = document.getElementById('sim-steps');
    const goalInput = document.getElementById('sim-goal');
    if(!targetInput) return;
    document.getElementById('sim-target-val').textContent = targetInput.value + ' ' + units;
    document.getElementById('sim-steps-val').textContent = parseInt(stepsInput.value).toLocaleString('es-ES') + ' pasos';
    const overrides = {
      profile: {
        targetWeightKg: Utils.weightUnitInputToKg(parseFloat(targetInput.value), units),
        steps: parseInt(stepsInput.value)
      },
      goal: goalInput.value
    };
    const sim = Calc.simulate(state, overrides);
    const container = document.getElementById('view-whatif');
    // re-render only right column result to avoid resetting sliders
    const s = sim;
    const resultCol = container.querySelector('.span-7');
    resultCol.innerHTML = `
      <div class="card-title"><div><span class="eyebrow">Resultado estimado</span><h3>Nuevo plan</h3></div></div>
      <div class="grid grid-3" style="margin-bottom:16px;">
        ${StatCard({icon:Icon.flame, label:'Calorías', value:s.targets.kcal, unit:'kcal', color:'#f0955c'})}
        ${StatCard({icon:Icon.dumbbell, label:'Proteína', value:s.targets.proteinG, unit:'g', color:'#b7d64a'})}
        ${StatCard({icon:Icon.trend, label:'Semanas al objetivo', value:s.forecast.weeksToGoal||'—', color:'#57bfb0'})}
      </div>
      ${ForecastChartSVG(s.forecast, state)}
    `;
  }
}

function gymMigrate(d){
  if(d.gym) return;
  d.gym={start:Utils.isoWeekStart(Utils.todayISO()),mode:'normal',schedule:{0:'A',2:'B',4:'C'},logs:[],active:null};
  d.training=JSON.parse(JSON.stringify(GYM_DEF_TRAINING));

    <div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--text-dim);line-height:1.55">

    <div>• <b>Sin piernas pesadas el miércoles ni el viernes:</b> el miércoles es la víspera del pádel y el viernes la de la tirada larga. Ambos días son solo torso.</div>
    <div>• <b>Torso dos veces por semana:</b> pecho, espalda y hombros 2×/sem reparte mejor el volumen (~10-12 series semanales por grupo) que una sola sesión larga.</div>
    <div>• <b>Core 3×/sem</b> con flexión, elevación de piernas y estabilidad. Los abdominales se ven con grasa baja, así que la nutrición pesa tanto como el entrenamiento.</div>
    <div>• <b>Martes:</b> rodaje (el día después de piernas, por eso la calidad es moderada). <b>Domingo:</b> descanso o trote opcional.</div></div></div>`;
  },
  viewProgress(){
    const g=this.d(),all=[];Object.values(GYM_S).forEach(s=>s.ex.forEach(e=>all.push(e)));
    const vol=g.logs.reduce((t,l)=>t+l.vol,0);
    const rows=all.map(e=>{
      const pts=g.logs.filter(l=>l.sets[e.id]).map(l=>Math.max(...l.sets[e.id].map(s=>e.unit==='s'?s.r:s.w*(1+s.r/30))));
      if(!pts.length)return `<tr><td>${e.n}</td><td colspan="3" style="color:var(--text-faint)">Sin datos</td></tr>`;
      const dl=Utils.round((pts[pts.length-1]/pts[0]-1)*100),mx=Math.max(...pts),mn=Math.min(...pts);
      const sp=pts.length>1?`<svg class="gsp" viewBox="0 0 90 26"><polyline fill="none" stroke="var(--lime)" stroke-width="2" points="${pts.map((v,i)=>`${(i/(pts.length-1)*86+2).toFixed(1)},${(22-(v-mn)/((mx-mn)||1)*18).toFixed(1)}`).join(' ')}"/></svg>`:'';
      return `<tr><td>${e.n}</td><td style="font-family:var(--font-mono)">${this.lastTxt(e.id)}</td><td>${sp}</td><td><span class="tag ${dl>0?'tag-lime':dl<0?'tag-red':''}">${dl>0?'+':''}${dl}%</span></td></tr>`;}).join('');
    return `<div class="grid grid-3" style="margin-bottom:16px">${StatCard({icon:Icon.dumbbell,label:'Sesiones',value:g.logs.length,color:'#b7d64a'})}${StatCard({icon:Icon.trend,label:'Volumen total',value:Utils.round(vol/1000,1),unit:'t',color:'#f0955c'})}${StatCard({icon:Icon.target,label:'Semana del bloque',value:(this.wk()+1)+'/8',color:'#57bfb0'})}</div>
    <div class="card" style="overflow-x:auto"><div class="card-title"><div><span class="eyebrow">Indicador por ejercicio</span><h3>Fuerza estimada (1RM) · evolución</h3></div></div>
    <table class="simple-table"><tr><th>Ejercicio</th><th>Última sesión (kg×reps)</th><th>Tendencia</th><th>Cambio</th></tr>${rows}</table></div>`;
  },
  viewHistory(){
    const L=this.d().logs;
    if(!L.length)return `<div class="empty-state">${Icon.dumbbell}<h4>Aún no hay sesiones</h4><p>Completa tu primer entrenamiento para ver aquí tu historial.</p></div>`;
    return L.map((l,i)=>[l,i]).reverse().map(([l,i])=>{const s=GYM_S[l.sessionId];
      return `<details class="card" style="margin-bottom:10px;padding:14px"><summary style="cursor:pointer;display:flex;justify-content:space-between;gap:8px;list-style:none"><span><b>${s.name}</b> <span style="color:var(--text-faint);font-size:12px">· ${Utils.formatDateShort(l.date)} · sem ${l.week+1}</span></span><span class="tag tag-lime">${l.durMin} min · ${l.vol.toLocaleString('es-ES')} kg</span></summary>
      <div style="margin-top:12px">${s.ex.filter(e=>l.sets[e.id]).map(e=>`<div class="gex"><div class="t"><span>${e.n}</span><span style="font-family:var(--font-mono);font-weight:500">${l.sets[e.id].map(x=>e.unit==='s'?x.r+'s':x.w+'×'+x.r).join(' · ')}</span></div></div>`).join('')}
      <button class="btn btn-sm btn-danger" data-g="del" data-i="${i}">${Icon.trash} Borrar</button></div></details>`;}).join('');
  },
  viewPlan(){
    const g=this.d(),cur=this.wk();
    return `<div class="card" style="margin-bottom:16px"><div class="card-title"><div><span class="eyebrow">Progresión</span><h3>Plan de 8 semanas</h3></div></div>
    <div style="overflow-x:auto"><table class="simple-table"><tr><th>Sem</th><th>Fase</th><th>RIR</th><th>Series</th><th>Cargas</th></tr>${GYM_WEEKS.map((w,i)=>`<tr style="${i===cur?'background:var(--lime-glow)':''}"><td>${i+1}</td><td>${w.l}<div style="font-size:10.5px;color:var(--text-faint)">${w.n}</div></td><td>${w.rir}</td><td>${w.ds<0?'−1':'Completas'}</td><td>${w.deload?'~90%':'Doble progresión'}</td></tr>`).join('')}</table></div>
    <div class="field" style="margin-top:14px;max-width:260px"><label>Inicio del bloque</label><input type="date" id="g-start" value="${g.start}"><div class="hint">Tras la semana 8 el bloque vuelve a empezar con cargas más altas.</div></div></div>
    <div class="card"><div class="card-title"><div><span class="eyebrow">Reglas</span><h3>Doble progresión y control de intensidad</h3></div></div>
    <div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px;color:var(--text-dim);line-height:1.55">
    <div>1. Cada ejercicio tiene un rango (p. ej. 8-12). Empieza con un peso con el que llegues al mínimo con el RIR de la semana.</div>
    <div>2. Mantén el peso y suma repeticiones en cada sesión hasta lograr el <b>máximo del rango en todas las series</b>.</div>
    <div>3. Entonces sube el peso (+2-2,5 kg en mancuernas y poleas, +5 kg en prensa) y vuelve al mínimo del rango. La app te lo indica con «↑ Sube».</div>
    <div>4. <b>RIR</b> = repeticiones que te quedan en el depósito. Los básicos se quedan en RIR 1-3; no entrenes al fallo salvo la última serie de aislamientos en semanas 6-7.</div>
    <div>5. Si pierdes repeticiones dos sesiones seguidas, duermes mal o llegas con las piernas cargadas, usa «Poca energía» o adelanta la descarga.</div>
    <div>6. La semana 8 es de descarga: una serie menos y ~90% del peso. Es lo que te permite rendir mejor en el siguiente bloque.</div></div></div>`;
  },
  render(state){
    const tabs=[['semana','Semana'],['progreso','Progreso'],['historial','Historial'],['plan','Plan 8 sem.']];
    const body={semana:'viewWeek',progreso:'viewProgress',historial:'viewHistory',plan:'viewPlan'}[this.tab];
    return `${state.gym.active?this.todayBanner(state):''}<div class="filter-bar">${tabs.map(t=>`<button class="chip ${this.tab===t[0]?'active':''}" data-g="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${this[body]()}`;
  },
  ficha(id){
    const g=this.d(),wk=this.wk(),s=GYM_S[id],ex=this.sess(id,wk,g.mode),bl=this.blocks(ex);
    Modal.open(`<div class="modal-head"><h2>${s.name}</h2><button class="icon-btn" data-g="mclose">${Icon.x}</button></div><div class="modal-body">
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px"><span class="tag tag-lime">~${this.total(ex)} min</span><span class="tag">RIR ${this.rirTxt(wk,g.mode)}</span><span class="tag">${s.muscles}</span></div>
