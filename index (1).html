      ${bl.map(b=>`${b.items.length>1?`<div class="eyebrow" style="margin:10px 0 6px">Superserie · ~${b.min} min (alterna sin descanso entre ambos)</div>`:''}${b.items.map(e=>{const r=this.rec(e,wk);return `<div class="gex"><div class="t"><span>${e.n}</span><span style="font-family:var(--font-mono)">${this.tgt(e)}</span></div>
      <div style="color:var(--text-dim)">${e.m} · descanso ${e.rest}s${b.items.length===1?' · ~'+b.min+' min':''}</div><p>${e.tip}</p><p>Alternativa: ${e.alt}</p><p>Última vez: ${this.lastTxt(e.id)} <span class="${r.c}" style="margin-left:6px">${r.t}</span></p></div>`;}).join('')}`).join('')}
      <button class="btn btn-primary btn-block" style="margin-top:10px" data-g="${g.active&&g.active.sessionId===id?'resume':'start'}" data-id="${id}">${Icon.bolt} ${g.active&&g.active.sessionId===id?'Continuar entrenamiento':'Comenzar entrenamiento'}</button></div>`,{large:true});
  },

  /* ---------- Modo entrenamiento ---------- */
  start(id){
    const g=this.d();
    if(g.active&&g.active.sessionId!==id&&!confirm('Tienes un entrenamiento en curso. ¿Descartarlo y empezar este?'))return;
    if(!g.active||g.active.sessionId!==id){
      const wk=this.wk(),ex=this.sess(id,wk,g.mode),sets={};
      ex.forEach(e=>{const l=this.last(e.id),w=l?l.sets[l.sets.length-1].w:'';sets[e.id]=Array.from({length:e.sets},()=>({w:w||'',r:'',done:false}));});
      g.active={sessionId:id,week:wk,mode:g.mode,start:Date.now(),ex:0,sets};State.saveNow();
    }
    Modal.close();this.openWO();
  },
  openWO(){
    let o=document.getElementById('gym-wo');if(!o){o=document.createElement('div');o.id='gym-wo';o.className='gwo';document.body.appendChild(o);}
    document.body.style.overflow='hidden';this.renderWO();
    try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{});}catch(e){}
  },
  closeWO(){const o=document.getElementById('gym-wo');if(o)o.remove();document.body.style.overflow='';Router.render();},
  cur(){const a=this.d().active,ex=this.sess(a.sessionId,a.week,a.mode);return {a,ex,e:ex[a.ex]};},
  renderWO(){
    const g=this.d();if(!g.active)return;const {a,ex,e}=this.cur(),o=document.getElementById('gym-wo');if(!o)return;
    const S=GYM_S[a.sessionId],sets=a.sets[e.id],r=this.rec(e,a.week),partner=e.ss?ex.filter(x=>x.ss===e.ss&&x!==e):[];
    const dn=ex.map(x=>a.sets[x.id].every(s=>s.done));
    o.innerHTML=`<div class="gwo-top"><div><div class="eyebrow">${S.name}</div><div style="font-size:12px;color:var(--text-faint)">Ejercicio ${a.ex+1}/${ex.length} · <span id="g-el">0:00</span></div></div>
      <div style="display:flex;gap:8px"><button class="btn btn-sm btn-primary" data-g="finish">Finalizar</button><button class="icon-btn" data-g="exit" title="Salir (se guarda el progreso)">${Icon.x}</button></div></div>
    <div class="gwo-body"><div class="gdots">${ex.map((x,i)=>`<button class="${i===a.ex?'cur':dn[i]?'on':''}" data-g="jump" data-i="${i}"></button>`).join('')}</div>
      <h2 style="font-family:var(--font-display);font-weight:400;font-size:24px;margin-bottom:4px">${e.n}</h2>
      <div style="color:var(--text-faint);font-size:12px;margin-bottom:12px">${e.m}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px"><span class="tag tag-lime">${this.tgt(e)}</span><span class="tag">RIR ${this.rirTxt(a.week,a.mode)}</span><span class="tag">Descanso ${e.rest}s</span>${partner.length?`<span class="tag tag-violet">Superserie con ${partner.map(p=>p.n).join(', ')}</span>`:''}</div>
      <div class="gex"><p style="margin:0;color:var(--text-dim)">${e.tip}</p><p>Si la máquina está ocupada: ${e.alt}</p><p>Última vez: ${this.lastTxt(e.id)} <span class="${r.c}" style="margin-left:6px">${r.t}</span></p></div>
      <div class="eyebrow" style="margin:14px 0 8px;display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;text-align:center"><span>#</span><span>${e.unit==='s'?'—':'Kg'}</span><span>${e.unit==='s'?'Segundos':'Reps'}</span><span></span></div>
      ${sets.map((s,i)=>`<div class="gset ${s.done?'done':''}"><span class="n">${i+1}</span><input type="number" inputmode="decimal" step="0.5" placeholder="kg" value="${s.w}" data-g-in="w" data-i="${i}" ${e.unit==='s'?'disabled style="opacity:.3"':''}><input type="number" inputmode="numeric" placeholder="${e.r[0]}-${e.r[1]}" value="${s.r}" data-g-in="r" data-i="${i}"><button class="gcheck" data-g="set" data-i="${i}">${Icon.check}</button></div>`).join('')}
      <div style="display:flex;gap:10px;margin-top:16px"><button class="btn" style="flex:1" data-g="go" data-d="-1" ${a.ex===0?'disabled':''}>← Anterior</button><button class="btn" style="flex:1" data-g="go" data-d="1" ${a.ex===ex.length-1?'disabled':''}>Siguiente →</button></div></div>
    <div class="gwo-foot"><div class="grest"><div><div class="eyebrow">Descanso</div><div class="tm" id="g-rt">—</div></div><div class="bar-track"><div class="bar-fill" id="g-rb" style="width:0;background:var(--lime)"></div></div>
      <button class="btn btn-sm" data-g="rest" data-v="-15">−15</button><button class="btn btn-sm" data-g="rest" data-v="15">+15</button><button class="btn btn-sm" data-g="rest" data-v="0">Saltar</button></div></div>`;
    this.tick();
  },
  setDone(i){
    const {a,ex,e}=this.cur(),s=a.sets[e.id][i];
    if(s.done){s.done=false;State.save();this.renderWO();return;}
    if(!(parseFloat(s.r)>0)){Toast.show('Anota las repeticiones antes de marcar la serie.',Icon.x);return;}
    s.done=true;const nx=a.sets[e.id][i+1];if(nx&&nx.w===''&&s.w!=='')nx.w=s.w;
    const grp=e.ss?ex.map((x,k)=>x.ss===e.ss?k:-1).filter(k=>k>=0):[a.ex],pos=grp.indexOf(a.ex);
    if(pos<grp.length-1){a.ex=grp[pos+1];}
    else{this.startRest(e.rest);const p=grp.find(k=>a.sets[ex[k].id].some(x=>!x.done));if(p!==undefined)a.ex=p;}
    State.save();this.renderWO();
  },
  startRest(sec){this.rest={end:Date.now()+sec*1000,total:sec,beeped:false};},
  adjRest(v){if(v===0){this.rest=null;}else if(this.rest){this.rest.end+=v*1000;this.rest.total=Math.max(this.rest.total,(this.rest.end-Date.now())/1000);this.rest.beeped=false;}this.renderWO();},
  nav(d){const {a,ex}=this.cur();a.ex=Utils.clamp(a.ex+d,0,ex.length-1);State.save();this.renderWO();},
  tick(){
    const a=this.d()&&this.d().active,el=document.getElementById('g-el');
    if(el&&a)el.textContent=this.fmt((Date.now()-a.start)/1000);
    const rt=document.getElementById('g-rt'),r=this.rest;if(!rt)return;
    if(!r){rt.textContent='—';return;}
    const left=Math.ceil((r.end-Date.now())/1000);rt.textContent=left>0?this.fmt(left):'¡Listo!';
    const b=document.getElementById('g-rb');if(b)b.style.width=Utils.clamp(100-left/r.total*100,0,100)+'%';
    if(left<=0&&!r.beeped){r.beeped=true;this.beep();navigator.vibrate&&navigator.vibrate([200,100,200]);}
  },
  beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),n=c.createGain();o.connect(n);n.connect(c.destination);o.frequency.value=880;n.gain.value=.2;o.start();o.stop(c.currentTime+.35);}catch(e){}},
  finish(){
    const g=this.d(),{a,ex}=this.cur();let vol=0,done=0,tot=0,exDone=0;const sets={};
    ex.forEach(e=>{const ds=a.sets[e.id].filter(s=>s.done);tot+=e.sets;done+=ds.length;if(ds.length===e.sets)exDone++;
      if(ds.length){sets[e.id]=ds.map(s=>({w:+s.w||0,r:+s.r}));ds.forEach(s=>vol+=(+s.w||0)*(+s.r));}});
    if(!done){if(confirm('No has completado ninguna serie. ¿Descartar el entrenamiento?')){g.active=null;this.rest=null;State.saveNow();this.closeWO();}return;}
    const rec={date:Utils.todayISO(),sessionId:a.sessionId,week:a.week,durMin:Math.max(1,Math.round((Date.now()-a.start)/60000)),vol:Math.round(vol),sets,done,tot,exDone,exTot:ex.length};
    g.logs.push(rec);g.active=null;this.rest=null;State.saveNow();
    document.getElementById('gym-wo').innerHTML=`<div class="gwo-body" style="padding-top:40px"><span class="eyebrow">Sesión completada</span><h2 style="font-family:var(--font-display);font-weight:400;font-size:28px;margin:6px 0 18px">${GYM_S[rec.sessionId].name}</h2>
      <div class="grid grid-2" style="margin-bottom:16px">${StatCard({icon:Icon.clock,label:'Duración',value:rec.durMin,unit:'min',color:'#57bfb0'})}${StatCard({icon:Icon.trend,label:'Volumen',value:rec.vol.toLocaleString('es-ES'),unit:'kg',color:'#f0955c'})}${StatCard({icon:Icon.check,label:'Ejercicios completos',value:rec.exDone+'/'+rec.exTot,color:'#b7d64a'})}${StatCard({icon:Icon.dumbbell,label:'Series',value:rec.done+'/'+rec.tot,color:'#9d8cf0'})}</div>
      <div class="card"><div class="card-title"><h3>Para la próxima sesión</h3></div>${ex.filter(e=>sets[e.id]).map(e=>{const r=this.rec(e,a.week);return `<div class="row-between" style="font-size:12.5px;padding:6px 0;gap:8px"><span>${e.n}</span><span class="${r.c}">${r.t.split(' (')[0]}</span></div>`;}).join('')}</div>
      <button class="btn btn-primary btn-block" style="margin-top:16px" data-g="done">Cerrar</button></div>`;
  }
};
Views.gym=function(state){return Gym.render(state);};
Router.titles.gym='Gimnasio';
(function(){
  const r=Router.render;
  Router.render=function(){ if(this.current==='gym'){document.getElementById('view-gym').innerHTML=Views.gym(State.data);this.updateGlobals();} else r.call(this); };
  const dash=Views.dashboard;Views.dashboard=function(s){return Gym.todayBanner(s)+dash(s);};
  setInterval(()=>Gym.tick(),500);
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-g]');if(!t)return;const g=Gym.d(),a=t.dataset.g;
    if(a==='tab'){Gym.tab=t.dataset.v;Router.render();}
    else if(a==='mode'){g.mode=t.dataset.v;State.save();Router.render();}
    else if(a==='ficha')Gym.ficha(t.dataset.id);
    else if(a==='mclose')Modal.close();
    else if(a==='start')Gym.start(t.dataset.id);
    else if(a==='resume'){Modal.close();Gym.openWO();}
    else if(a==='set')Gym.setDone(+t.dataset.i);
    else if(a==='go')Gym.nav(+t.dataset.d);
    else if(a==='jump'){g.active.ex=+t.dataset.i;Gym.renderWO();}
    else if(a==='rest')Gym.adjRest(+t.dataset.v);
    else if(a==='exit')Gym.closeWO();
    else if(a==='finish'){if(confirm('¿Finalizar y guardar el entrenamiento?'))Gym.finish();}
    else if(a==='done')Gym.closeWO();
    else if(a==='del'&&confirm('¿Borrar esta sesión del historial?')){g.logs.splice(+t.dataset.i,1);State.saveNow();Router.render();}
  });
  document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.gIn){const {a,e:x}=Gym.cur();a.sets[x.id][+t.dataset.i][t.dataset.gIn]=t.value;State.save();}});
  document.addEventListener('change',e=>{if(e.target.id==='g-start'&&e.target.value){Gym.d().start=e.target.value;State.save();Router.render();}});
})();

const RUN_PH=[
{n:'Base aeróbica',c:'tag-teal',o:'Construir base aeróbica sin prisa y tolerar el volumen junto al gimnasio.'},
{n:'Resistencia',c:'tag-lime',o:'Subir la tirada larga de forma gradual e introducir series cortas.'},

{n:'Consolidación',c:'tag-violet',o:'Asentar tiradas de 16-18 km y bloques largos a ritmo de carrera.'},
{n:'Descarga y carrera',c:'tag-red',o:'Reducir carga, llegar fresco y confiar en el trabajo hecho.'}];
const RUN_DEF_TRAINING={0:{type:'Gimnasio',duration:60,intensity:'alta',notes:'Piernas + core'},1:{type:'Running',duration:40,intensity:'baja',notes:'Rodaje'},2:{type:'Gimnasio',duration:55,intensity:'media',notes:'Torso A: pecho + espalda'},3:{type:'Pádel',duration:75,intensity:'media',notes:'Partido'},4:{type:'Gimnasio',duration:55,intensity:'media',notes:'Torso B: hombros + brazos'},5:{type:'Running',duration:60,intensity:'media',notes:'Tirada larga'},6:{type:'Descanso',duration:0,intensity:'baja',notes:'Descanso / trote opcional'}};
function runMigrate(d){
  if(d.run){if(!d.run.v2){d.run.v2=1;if(d.run.ref5k===330)d.run.ref5k=305;if(d.gym)d.gym.schedule={0:'A',2:'B',4:'C'};if(d.training){d.training[1]={type:'Running',duration:40,intensity:'baja',notes:'Rodaje'};d.training[2]={type:'Gimnasio',duration:55,intensity:'media',notes:'Torso A: pecho + espalda'};}}return;}
  d.run={start:Utils.isoWeekStart(Utils.todayISO()),raceDate:'2027-04-11',confirmed:false,goalSec:7190,ref5k:305,mode:'normal',logs:[],done:{}};
  if(d.gym)d.gym.schedule={0:'A',2:'B',4:'C'};d.run.v2=1;
  d.training=JSON.parse(JSON.stringify(RUN_DEF_TRAINING));
}
(function(){const i=State.init;State.init=function(){i.call(this);runMigrate(this.data);this.saveNow();};})();

const Run={
  tab:'semana',_k:null,_p:null,pre:null,
  d(){return State.data&&State.data.run;},

  wmon(date){return Math.round((new Date(Utils.isoWeekStart(date)+'T00:00:00')-new Date(this.d().start+'T00:00:00'))/6048e5)+1;},

  paceChart(){

    if(L.length<2)return `<div class="empty-state" style="padding:24px 10px">${Icon.trend}<h4>Aún no hay suficientes carreras</h4><p>Registra al menos dos para ver la evolución frente al ritmo objetivo.</p></div>`;
    const w=480,h=170,p=30,ps=L.map(l=>l.sec/l.km),g=this.d().goalSec/21.0975,all=ps.concat(g),mn=Math.min(...all)-10,mx=Math.max(...all)+10,x=i=>p+i/(L.length-1)*(w-2*p),y=v=>p+(v-mn)/(mx-mn)*(h-2*p);
    return `<svg viewBox="0 0 ${w} ${h}" width="100%"><line x1="${p}" x2="${w-p}" y1="${y(g)}" y2="${y(g)}" stroke="var(--apricot)" stroke-dasharray="4 4"/><text x="${w-p}" y="${y(g)-5}" text-anchor="end" font-size="10" fill="var(--text-faint)" font-family="ui-monospace,monospace">Objetivo ${this.pf(g)}/km</text>
    <polyline fill="none" stroke="var(--lime)" stroke-width="2.4" points="${ps.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>${ps.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--lime)"/>`).join('')}</svg><div class="hint" style="font-size:10.5px;color:var(--text-faint)">Más arriba = más rápido. Los rodajes suaves quedan por debajo del objetivo: es normal.</div>`;
  },
  vLog(){
    const r=this.d(),pre=this.pre||{},cur=this.cw(),L=r.logs.slice().sort((a,b)=>a.date<b.date?1:-1);this.pre=null;
    const wk=[];for(let i=1;i<=cur&&i<=this.nW();i++){const ls=this.weekLogs(i),km=ls.reduce((t,l)=>t+l.km,0),sec=ls.reduce((t,l)=>t+l.sec,0),pl=this.plan()[i-1].km;wk.push({i,km,pl,n:ls.length,pace:km?sec/km:0});}
    return `<div class="card" style="margin-bottom:16px"><div class="card-title"><div><span class="eyebrow">Nuevo registro</span><h3>Registrar carrera</h3></div></div>
    <div class="field-row"><div class="field"><label>Fecha</label><input type="date" id="rl-date" value="${pre.date||Utils.todayISO()}"></div><div class="field"><label>Distancia (km)</label><input type="number" step="0.01" id="rl-km" value="${pre.km||''}"></div><div class="field"><label>Tiempo (mm:ss o h:mm:ss)</label><input type="text" id="rl-time" placeholder="31:20"></div></div>
    <div class="field-row"><div class="field"><label>FC media (opcional)</label><input type="number" id="rl-hr"></div><div class="field"><label>Esfuerzo percibido RPE (1-10)</label><input type="number" min="1" max="10" id="rl-rpe"></div></div>
    <div class="field"><label>Ritmo por km (opcional, separado por comas)</label><input type="text" id="rl-splits" placeholder="5:42, 5:40, 5:38"></div>
    <div class="field"><label>Sensaciones y observaciones</label><input type="text" id="rl-notes"></div><button class="btn btn-primary" data-r="logsave">${Icon.check} Guardar carrera</button></div>
    <div class="card" style="margin-bottom:16px;overflow-x:auto"><div class="card-title"><div><span class="eyebrow">Resumen semanal</span><h3>Planificado vs realizado</h3></div></div><table class="simple-table"><tr><th>Sem</th><th>Planificado</th><th>Realizado</th><th>Sesiones</th><th>Ritmo medio</th></tr>${wk.map(x=>`<tr><td>${x.i}</td><td>${x.pl} km</td><td><div style="font-family:var(--font-mono)">${Utils.round(x.km,1)} km</div><div class="bar-track" style="margin-top:4px"><div class="bar-fill" style="width:${Utils.clamp(x.km/x.pl*100,0,100)}%;background:var(--apricot)"></div></div></td><td>${x.n}</td><td style="font-family:var(--font-mono)">${x.pace?this.pf(x.pace)+'/km':'—'}</td></tr>`).join('')}</table></div>
    <div class="card"><div class="card-title"><div><span class="eyebrow">Historial</span><h3>Carreras registradas</h3></div></div>${L.length?L.map(l=>`<div class="gex"><div class="t"><span>${Utils.formatDateShort(l.date)} · ${l.km} km</span><span style="font-family:var(--font-mono)">${this.hms(l.sec).replace(/^0:/,'')} · ${this.pf(l.sec/l.km)}/km</span></div><p>RPE ${l.rpe||'—'}${l.hr?' · FC '+l.hr+' ppm':''}${l.splits?' · Parciales: '+Utils.escapeHtml(l.splits):''}${l.notes?'<br>'+Utils.escapeHtml(l.notes):''}</p><button class="btn btn-sm btn-danger" data-r="logdel" data-id="${l.id}">${Icon.trash}</button></div>`).join(''):'<p style="font-size:12px;color:var(--text-faint)">Todavía no hay carreras registradas.</p>'}</div>`;
  },
  render(){
    const tabs=[['semana','Semana'],['plan','Plan'],['obj','Objetivo'],['log','Registro']],b={semana:'vSemana',plan:'vPlan',obj:'vObj',log:'vLog'}[this.tab];
    return `<div class="filter-bar">${tabs.map(t=>`<button class="chip ${this.tab===t[0]?'active':''}" data-r="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</div>${this[b]()}`;
  }
};

/* Resumen semanal unificado: gimnasio + running + pádel + descanso */
Gym.weekStrip=function(){
  const st=State.data,g=this.d(),ws=Utils.isoWeekStart(Utils.todayISO()),ti=Utils.weekdayIndex(Utils.todayISO()),wi=Run.weekOf(ws),w=wi?Run.week(wi):null;
  return `<div class="gweek">${CONFIG.DAYS_SHORT.map((d,i)=>{
    const date=Utils.addDays(ws,i),t=st.training[i]||{type:'Descanso'},sid=g.schedule[i],rs=w&&w.ses.find(s=>s.day===i&&!s.opt);
    const k=sid?'lime':rs?'apricot':t.type==='Pádel'?'teal':'rest',ic=sid?Icon.dumbbell:rs?Icon.footprints:t.type==='Pádel'?Icon.bolt:Icon.moon;
    const lb=sid?GYM_S[sid].short:rs?(rs.type==='R'?'CARRERA':(rs.type==='L'?'Larga ':'Rodaje ')+rs.km+' km'):t.type==='Pádel'?'Pádel':'Descanso';
    return `<div class="gday ${k} ${i===ti?'today':''}" data-r="day" data-date="${date}" style="cursor:pointer"><b>${d}</b><span class="gi">${ic}</span><small>${lb}</small>${Run.isDone(date)?`<i class="gdone">${Icon.check}</i>`:''}</div>`;}).join('')}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><span class="tag tag-lime">Gimnasio</span><span class="tag tag-apricot">Running</span><span class="tag tag-teal">Pádel</span><span class="tag">Descanso</span></div>`;
};
/* Gimnasio: recorte automático de piernas en semanas de mucha carrera */
(function(){const o=Gym.sess;Gym.sess=function(id,wk,mode){let ex=o.call(this,id,wk,mode);
  if(id==='A'&&Run.d()&&Run.heavyLeg())ex=ex.filter(e=>e.id!=='gemelo').map(e=>(e.id==='bulg'||e.id==='curlf')?{...e,sets:Math.max(2,e.sets-1)}:e);return ex;};})();

Views.run=function(){return Run.render();};
Router.titles.run='Running';
(function(){
  const r0=Router.render;
  Router.render=function(){if(this.current==='run'){document.getElementById('view-run').innerHTML=Views.run();this.updateGlobals();}else r0.call(this);};
  const dash=Views.dashboard;Views.dashboard=function(s){return Run.banner()+dash(s);};
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-r]');if(!t)return;const r=Run.d(),a=t.dataset.r;
    if(a==='tab'){Run.tab=t.dataset.v;Router.render();}
    else if(a==='day')Run.dayModal(t.dataset.date);
    else if(a==='mclose')Modal.close();
    else if(a==='done'){r.done[t.dataset.date]=!r.done[t.dataset.date];State.saveNow();Run.dayModal(t.dataset.date);Router.render();}
    else if(a==='mode'){r.mode=t.dataset.v;State.save();Router.render();}
    else if(a==='repeat'){if(Run.nW()>8&&confirm('Se retrasa el plan una semana y se comprime el resto hasta la carrera. ¿Continuar?')){r.start=Utils.addDays(r.start,7);State.saveNow();Router.render();}else if(Run.nW()<=8)Toast.show('Quedan pocas semanas: mejor ajusta con el modo Fatiga.',Icon.x);}
    else if(a==='logf'){Modal.close();Run.pre={date:t.dataset.date,km:t.dataset.km};Run.tab='log';Router.go('run');}
    else if(a==='logsave'){
      const v=id=>document.getElementById(id).value,km=parseFloat(v('rl-km')),sec=Run.parseT(v('rl-time'));
      if(!(km>0)||!(sec>0)){Toast.show('Indica distancia y tiempo válidos.',Icon.x);return;}
      r.logs.push({id:Utils.uid('run'),date:v('rl-date')||Utils.todayISO(),km,sec,hr:parseInt(v('rl-hr'))||0,rpe:parseInt(v('rl-rpe'))||0,splits:v('rl-splits'),notes:v('rl-notes')});
      State.saveNow();Router.render();Toast.show('Carrera registrada.',Icon.check);}
    else if(a==='logdel'&&confirm('¿Borrar esta carrera?')){r.logs=r.logs.filter(l=>l.id!==t.dataset.id);State.saveNow();Router.render();}
    else if(a==='saveset'){
      const d=document.getElementById('rs-date').value,g=Run.parseT(document.getElementById('rs-goal').value),f=Run.parseT(document.getElementById('rs-ref').value);
      if(!d||g<3600||f<150){Toast.show('Revisa fecha, tiempo objetivo (h:mm:ss) y ritmo (m:ss).',Icon.x);return;}
      r.raceDate=d;r.goalSec=g;r.ref5k=f;r.confirmed=document.getElementById('rs-conf').checked;State.saveNow();Router.render();Toast.show('Objetivo actualizado: ritmos y plan recalculados.',Icon.target);}
  });
})();

/* ==================== INIT ==================== */
function initApp(){
  State.init();
  if(!State.data.settings.animations) document.body.classList.add('no-anim');
  wireGlobalEvents();
  Router.go('dashboard');
}

document.addEventListener('DOMContentLoaded', initApp);
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}

</script>
